function trend(cur, prev) {
  const d = cur - prev;
  if (d > 2) return { c: 'up', s: '↑', d: d };
  if (d < -2) return { c: 'down', s: '↓', d: d };
  return { c: 'flat', s: '—', d: d };
}

function person() {
  if (D.sampleMode === 'boundary' && D.screen === 'analysis') return BOUNDARY_PERSON;
  if (D.sampleMode === 'boundary' && D.screen === 'reply') return BOUNDARY_PERSON;
  return PEOPLE[D.current];
}

function counts(p) {
  let u = 0, f = 0, dn = 0;
  ['fam', 'heat', 'comf', 'off'].forEach(function (k) {
    const t = trend(p.dims[k], p.prev[k]);
    if (t.c === 'up') u++; else if (t.c === 'down') dn++; else f++;
  });
  return u + ' 升 · ' + f + ' 平 · ' + dn + ' 降';
}

function chart(p) {
  const h = p.history;
  const W = 300, T = 8, B = 88, L = 6, R = 6;
  const min = 15, max = 95;
  const x = function (i) { return L + i * (W - L - R) / (h.length - 1); };
  const y = function (v) { return B - (v - min) / (max - min) * (B - T); };
  const ser = [
    { k: 'fam', c: '#ff4f7b' },
    { k: 'heat', c: '#6c4ce0' },
    { k: 'comf', c: '#f2994a' },
    { k: 'off', c: '#2aa8a0' }
  ];
  let out = '<svg class="chart" viewBox="0 0 300 96" xmlns="http://www.w3.org/2000/svg">';
  out += '<line x1="' + L + '" y1="' + (B + 2) + '" x2="' + (W - R) + '" y2="' + (B + 2) + '" stroke="rgba(28,27,34,.08)" stroke-width="1"/>';
  ser.forEach(function (s) {
    const d = h.map(function (row, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(row[s.k]).toFixed(1); }).join(' ');
    out += '<path d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>';
  });
  ser.forEach(function (s) {
    const last = h[h.length - 1];
    out += '<circle cx="' + x(h.length - 1).toFixed(1) + '" cy="' + y(last[s.k]).toFixed(1) + '" r="3" fill="#fff" stroke="' + s.c + '" stroke-width="1.9"/>';
  });
  out += '</svg>';
  return out;
}

    '<div class="privacy"><span>✦</span><div>Key 只存在这台设备的 secure storage 里，不上传、不进日志、不进代码仓库。换设备要重新填。</div></div>' +
    '<div style="height:12px"></div>' +
    '<div class="boundary"><em></em><span>网页版直连会被浏览器的跨域策略拦掉。想跑通真实请求，要用 Windows 桌面版或 Android 真机。</span></div>' +
  '</div>';
}

function meScreen() {
  return '<div class="screen enter">' +
    '<div class="topbar"><span class="tt">我的</span></div>' +
    '<div class="card rows" style="padding:2px 15px">' +
      '<div class="rowitem" data-go="settings">模型设置<span class="go">›</span></div>' +
      '<div class="rowitem">导出我的数据<span class="go">›</span></div>' +
      '<div class="rowitem">删除聊天原文<span class="go">›</span></div>' +
      '<div class="rowitem danger">删除账户<span class="go">›</span></div>' +
      '<div class="rowitem">关于<span class="go">›</span></div>' +
    '</div>' +
    '<p class="tiny" style="margin-top:22px">妙恋畅语 · 原型 v2.12<br>设计与排布 · 阿砚 · 2026-10-25</p>' +
  '</div>';
}

function welcomeScreen() {
  return '<div class="screen enter"><div class="welcome">' +
    '<div class="logo">♡</div>' +
    '<h1>妙恋畅语</h1>' +
    '<p>把聊不明白的话，说明白一点。</p>' +
    '<ul class="pts">' +
      '<li>粘贴聊天，看清热度怎么变</li>' +
      '<li>三条候选回复，你自己挑</li>' +
      '<li>推不推进，最后你说了算</li>' +
    '</ul>' +
    '<label class="agree"><input type="checkbox" id="agree"> 我确认这些聊天内容我有权提供，并且尊重对方的意愿和边界</label>' +
    '<button class="btn primary" id="enter" disabled>开始</button>' +
    '<div style="height:8px"></div>' +
    '<button class="btn ghost" data-go="home">先随便看看</button>' +
    '<p class="tiny">不需要注册。Key 只在你自己的设备上。</p>' +
  '</div></div>';
}

const SCREENS = {
  welcome: welcomeScreen, home: homeScreen, panel: panelScreen, import: importScreen,
  analysis: analysisScreen, reply: replyScreen, templates: templatesScreen,
  new: newScreen, settings: settingsScreen, me: meScreen
};

function render() {
  document.getElementById('view').innerHTML = (SCREENS[D.screen] || homeScreen)();
  const dock = document.getElementById('dock');
  dock.className = 'dock' + (D.screen === 'welcome' ? ' hide' : '');
  Array.prototype.forEach.call(dock.querySelectorAll('[data-tab]'), function (el) {
    el.className = el.dataset.tab === D.screen ? 'on' : '';
  });
  document.getElementById('view').scrollTop = 0;
  if (D.screen === 'welcome') {
    const cb = document.getElementById('agree');
    const btn = document.getElementById('enter');
    cb.addEventListener('change', function () { btn.disabled = !cb.checked; });
    btn.addEventListener('click', function () { go('home'); });
  }
}

function go(s) {
  if (s === 'home' || s === 'panel') D.sampleMode = 'normal';
  D.screen = s;
  render();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(window.__tt);
  window.__tt = setTimeout(function () { t.classList.remove('on'); }, 1600);
}

function openSheet(k) {
  const p = PEOPLE[D.current];
  const names = { fam: '熟悉度', heat: '互动热度', comf: '舒适度', off: '线下推进' };
  const e = p.ev[k];
  const t = trend(p.dims[k], p.prev[k]);
  const sym = t.c === 'up' ? '↑ 升 ' + t.d + ' 点' : (t.c === 'down' ? '↓ 降 ' + Math.abs(t.d) + ' 点' : '— 基本没动');
  document.getElementById('sheetbox').innerHTML =
    '<div class="k"><b>' + names[k] + '</b><span>' + p.dims[k] + '<em>%</em></span></div>' +
    '<div style="font-size:11px;margin-top:4px" class="' + t.c + '">' + sym + '（对比 ' + p.history[p.history.length - 2].d + '）</div>' +
    '<p>' + e.text + '</p>' +
    '<div class="src">原文：' + e.src + '</div>';
  document.getElementById('sheet').classList.add('on');
}

document.addEventListener('click', function (ev) {
  const sheet = document.getElementById('sheet');
  if (ev.target === sheet) { sheet.classList.remove('on'); return; }
  const fold = ev.target.closest('[data-fold]');
  if (fold) {
    const body = document.getElementById('fold-' + fold.dataset.fold);
    body.classList.toggle('on');
    return;
  }
  const dim = ev.target.closest('[data-dim]');
  if (dim) { openSheet(dim.dataset.dim); return; }
  const pick = ev.target.closest('[data-pick]');
  if (pick) { D.current = pick.dataset.pick; render(); return; }
  const per = ev.target.closest('[data-person]');
  if (per) {
    D.current = per.dataset.person;
    D.sampleMode = 'normal';
    go('panel');
    return;
  }
  const copy = ev.target.closest('[data-copy]');
  if (copy) { toast('已复制，发不发你自己定'); return; }
  const nav = ev.target.closest('[data-go]');
  if (nav) { go(nav.dataset.go); return; }
  if (ev.target.id === 'do-analyze') { toast('分析完成'); go('analysis'); return; }
  if (ev.target.id === 'fill-normal') { D.sampleMode = 'normal'; go('import'); return; }
  if (ev.target.id === 'fill-boundary') { D.sampleMode = 'boundary'; go('import'); return; }
  if (ev.target.id === 'save-key') {
    const v = document.getElementById('keyinput').value.trim();
    D.apiKey = v;
    if (v) lsSet('mly_api_key', v); else lsDel('mly_api_key');
    document.getElementById('keystate').textContent = v ? '已保存到本机（' + v.slice(0, 3) + '****' + v.slice(-4) + '）' : '还没填。没填时只走模板库，不报错。';
    toast(v ? '已存到本机' : '已清空');
    return;
  }
  if (ev.target.id === 'clear-key') {
    D.apiKey = '';
    lsDel('mly_api_key');
    document.getElementById('keyinput').value = '';
    document.getElementById('keystate').textContent = '还没填。没填时只走模板库，不报错。';
    toast('已清除');
    return;
  }
});

render();
</script>
</body>
</html>
