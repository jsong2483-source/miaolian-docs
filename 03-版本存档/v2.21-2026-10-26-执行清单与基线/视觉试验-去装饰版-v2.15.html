  .screen { padding: 0 20px; }

  .soft { background: var(--accent-soft); border-radius: var(--r-card); padding: var(--sp4); }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; border: 0; border-radius: var(--r-btn); background: var(--card); color: var(--ink); font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn.plain { background: transparent; color: var(--muted); height: 44px; font-weight: 400; font-size: 14px; }
  .link { color: var(--accent); font-size: 14px; font-weight: 500; cursor: pointer; display: inline-block; }

  .nav div span { font-size: 12px; line-height: 1; }
  .nav div.on { color: var(--accent); }
  .nav svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  .li { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }

  .li.tap { cursor: pointer; }
  .li .grow { flex: 1; min-width: 0; }
  .av { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 15px; font-weight: 500; flex: none; }
  .av.g2 { background: #f2f0ec; color: #8a6a3f; }
  .chev { color: var(--faint); font-size: 15px; flex: none; padding-top: 2px; }
  .dim { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .dim:last-child { border-bottom: 0; }
  .dim .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .dim .k { font-size: 12px; color: var(--muted); }
  .dim .v { font-size: 15px; font-weight: 500; }
  .dim .tr { font-size: 12px; font-weight: 400; margin-left: 6px; }
  .dim .tr.up { color: var(--accent); }
  .dim .tr.flat { color: var(--faint); }
  .dim .tr.down { color: var(--cool); }
  .dim .ev { font-size: 13px; color: var(--muted); line-height: 1.6; margin-top: 4px; cursor: pointer; }
  .bound { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 1.6; padding: 12px 0; }
  .bound em { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; margin-top: 8px; }
  .bound.warn { color: var(--risk); }
  .bound.warn em { background: var(--risk); }
  .quote { border-left: 2px solid var(--line); padding-left: 12px; font-size: 15px; line-height: 1.65; }
  .seg { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-top: var(--sp4); }
  .seg div { position: relative; padding: 10px 0 11px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .seg div.on { color: var(--ink); font-weight: 500; }
  .seg div.on:after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
  .seg.sm { gap: 18px; border-bottom: 0; margin-top: 0; }
  .seg.sm div { padding: 6px 0; font-size: 13px; }
  .field { margin-top: var(--sp4); }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .input, .area { width: 100%; font-family: inherit; font-size: 15px; line-height: 1.7; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: var(--r-btn); padding: 13px 14px; outline: none; }
  .input:focus, .area:focus { border-color: var(--accent); }

  .shot { position: relative; background: #fff; border: 1px solid var(--line); border-radius: var(--r-thumb); overflow: hidden; height: 108px; }

  .shot i.me { background: #f2d8df; margin-left: 26px; }

  .shot.add { display: grid; place-items: center; border-style: dashed; color: var(--faint); font-size: 18px; cursor: pointer; background: transparent; }
  .who { flex: none; font-size: 12px; color: var(--muted); cursor: pointer; padding-top: 2px; }
  .who.on { color: var(--accent); font-weight: 500; }
  .step { display: flex; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--faint); }
  .step:last-child { border-bottom: 0; }
  .step em { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; font-size: 9px; font-style: normal; color: #fff; }
  .step.act { color: var(--ink); }
  .step.act em { border-color: var(--accent); animation: pl 1s infinite; }
  .step.done { color: var(--muted); }
  .step.done em { background: var(--ok); border-color: var(--ok); }
  @keyframes pl { 50% { opacity: .3; } }
  .cand { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .cand:last-child { border-bottom: 0; }
  .cand .txt { font-size: 15px; line-height: 1.7; }

  .cand.skip .txt { color: var(--muted); }

  .sheet { position: absolute; inset: 0; background: rgba(20, 20, 24, .28); display: none; align-items: flex-end; z-index: 20; }
  .sheet.on { display: flex; }
  .sheetbox { width: 100%; background: var(--card); border-radius: 20px 20px 0 0; padding: 22px 22px 26px; transform: translateY(100%); transition: transform .22s ease; }
  .sheet.on .sheetbox { transform: none; }
  .toast { position: fixed; left: 50%; bottom: 110px; transform: translate(-50%, 10px); background: rgba(26, 26, 31, .9); color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 10px; opacity: 0; pointer-events: none; transition: all .2s ease; z-index: 90; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .hint { position: fixed; left: 24px; bottom: 24px; width: 186px; font-size: 12px; color: #8b8b96; line-height: 1.9; }
  .hint b { display: block; color: #4b4b56; font-size: 12px; font-weight: 500; margin-bottom: 4px; }
  @media (max-width: 980px) { .hint { display: none; } }
  @media (max-width: 520px) { .stage { padding: 0; } .app { width: 100%; height: 100vh; height: 100dvh; border: 0; border-radius: 0; } .view { padding-top: 24px; } }
</style>

    '<div class="mt24"><label class="agree" style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">' +
      '<input type="checkbox" id="agree" style="margin-top:5px;accent-color:var(--accent)">' +
      '<span class="t-aux">我确认这些聊天内容我有权提供，并且尊重对方的意愿和边界</span></label></div>' +
    '<div class="mt16"><button class="btn primary" id="enter" disabled>开始</button></div>' +

}

function homeScreen() {

      '<div class="li tap" style="border:0;padding:0" data-person="' + p.id + '">' +
        '<div class="av ' + p.avc + '">' + p.av + '</div>' +

        '<span class="chev">›</span>' +
      '</div>' +
      '<p class="t-h2 mt16">' + p.stage + ' <span class="t-aux" style="font-weight:400;margin-left:6px">' + p.trText + '</span></p>' +
      '<p class="t-body mt8" style="color:var(--muted)">' + p.summary + '</p>' +

      '<div class="mt12"><span class="link" data-person="' + p.id + '">看关系面板 ›</span></div>' +

function panelScreen() {

  }).join('');
  return '<div class="screen enter">' +
    '<p class="t-title">关系</p>' + tabs +
    '<div class="mt16">' +
      '<p class="t-h2">' + p.stage + '</p>' +
      '<p class="t-aux mt4">' + p.trText + '</p>' +
      '<p class="t-body mt12" style="color:var(--muted)">' + p.summary + '</p>' +
    '</div>' +
    '<div class="mt24"><p class="t-cap">四个维度</p><div class="list mt8">' + dims + '</div></div>' +
    '<div class="mt16"><div class="bound ' + (p.bound.ok ? '' : 'warn') + '"><em></em><span>' + p.bound.text + '</span></div></div>' +
    '<div class="soft mt8"><p class="t-cap accent">下一步</p><p class="t-body mt8">' + p.today + '</p>' +
      '<div class="mt12"><span class="link" data-go="reply">去看回复建议 ›</span></div></div>' +
    '<div class="mt24 list">' +
      '<div class="li tap" data-fold="info"><div class="grow"><p class="t-body">关键信息</p><p class="t-aux mt4">' + p.info + '</p></div><span class="chev">›</span></div>' +
      '<div class="li tap" data-fold="time"><div class="grow"><p class="t-body">时间线</p><p class="t-aux mt4">近 30 天 3 条</p></div><span class="chev">›</span></div>' +
    '</div>' +
  '</div>';
}

function importScreen() {
  const seg = '<div class="seg">' +
    '<div class="' + (D.importTab === 'shot' ? 'on' : '') + '" data-tab2="shot">截图识别</div>' +
    '<div class="' + (D.importTab === 'paste' ? 'on' : '') + '" data-tab2="paste">粘贴文本</div>' +
  '</div>';
  const demo = '<p class="t-cap mt16" style="text-align:center">演示：<span class="link" id="fill-normal">普通场景</span> · <span class="link" id="fill-boundary">边界场景</span></p>';

  if (D.importTab === 'paste') {
    const txt = D.sampleMode === 'boundary'
      ? '我：周六有空吗，一起吃饭\n她：这周不太行\n我：那周日呢\n她：也不太想出门\n我：是不是我太急了\n她：不是，就是有点累\n她：改天吧'
      : '她：周末好像还有重映\n我：是吗，哪个影院\n她：就那个老片，我有点想看但懒得动\n我：那改天？\n她：嗯，再看吧\n我：最近在忙什么\n她：有点累，工作压得慌';
    return '<div class="screen enter">' +
      '<p class="t-title">导入聊天</p>' + seg +
      '<div class="field"><label>一行一条，开头标「我：」或「她：」</label><textarea class="area" id="chattext">' + txt + '</textarea></div>' +
      '<p class="t-aux mt12">粘贴是保底方案。微信只能单条复制，30 条就要复制 30 次，所以才要做截图识别。</p>' +
      '<div class="mt24"><button class="btn primary" id="do-analyze">开始分析</button></div>' + demo +
    '</div>';
  }
  const shots = [0, 1, 2].map(function () {
    return '<div class="shot"><i class="s"></i><i class="me"></i><i></i><i class="me"></i></div>';
  }).join('');
  return '<div class="screen enter">' +
    '<p class="t-title">导入聊天</p>' + seg +
    '<div class="mt24"><div style="display:flex;justify-content:space-between;align-items:baseline">' +
      '<span class="t-cap">已选 3 张</span><span class="t-cap">最多 20 张</span></div></div>' +
    '<div class="shots">' + shots + '<div class="shot add">＋</div></div>' +
    '<p class="t-aux mt12">连续截图会有重叠，识别时自动去重；顺序按图里的时间戳排，不靠文件名。</p>' +
    '<p class="t-aux mt8">识别全程在本机完成，图片不出设备。截图里常有对方的头像和昵称，识别前请先确认。</p>' +
    '<div class="mt24"><button class="btn primary" id="do-ocr">开始识别</button></div>' + demo +
  '</div>';
}

function ensureOcr() {
  if (D.ocrMode === D.sampleMode) return;
  const base = D.sampleMode === 'boundary' ? OCR_B : OCR_N;
  D.ocrRows = base.map(function (r) { return { me: r[0], t: r[1] }; });
  D.ocrMode = D.sampleMode;
}

function ocrScreen() {
  ensureOcr();
  const mine = D.ocrRows.filter(function (r) { return r.me; }).length;
  const rows = D.ocrRows.map(function (r, i) {
    return '<div class="li"><span class="who ' + (r.me ? 'on' : '') + '" data-ocr="' + i + '">' + (r.me ? '我' : '对方') + '</span>' +
      '<div class="grow"><p class="t-body">' + r.t + '</p></div></div>';
  }).join('');
  return '<div class="screen enter">' +
    '<p class="t-title">确认谁说的</p>' +
    '<p class="t-aux mt8">识别出 ' + D.ocrRows.length + ' 条，你 ' + mine + ' 条、对方 ' + (D.ocrRows.length - mine) + ' 条。点左边的字可以改。</p>' +
    '<div class="list mt16">' + rows + '</div>' +
    '<p class="t-aux mt16">改错一条，结论就可能反。所以这一屏不能省。</p>' +
    '<div class="mt24"><button class="btn primary" id="do-analyze">确认，开始分析</button></div>' +
    '<div class="mt8"><button class="btn plain" data-go="import">返回</button></div>' +
  '</div>';
}

function analyzingScreen() {
  const steps = [
    ['本机识别文字', '2.4s'],
    ['判断边界信号 · 本地规则', '20ms'],
    ['分析关系变化 · 模型', '4.6s'],
    ['生成三条回复 · 并行', '同时']
  ];
  const rows = steps.map(function (s, i) {
    return '<div class="step ' + (i === 0 ? 'act' : '') + '" id="st' + i + '"><em></em><span>' + s[0] + '</span>' +
      '<span style="margin-left:auto;font-size:12px;color:var(--faint)">' + s[1] + '</span></div>';
  }).join('');
  return '<div class="screen enter">' +
    '<p class="t-title">正在分析</p>' +
    '<div class="list mt24">' + rows + '</div>' +
    '<p class="t-aux mt24">边界判定 20 毫秒就出了。所以"能不能约"这件事，永远不会比模型慢。</p>' +
  '</div>';
}

function analysisScreen() {
  const p = person();
  const warn = !p.bound.ok;
  const sigs = warn
    ? ['她这周主动 0 次（上周 4 次）', '她两次主动把话题收掉', '她明确说过「改天吧」', '你连续三次提议、她三次都婉拒']
    : ['她主动开启话题 3 次（上周 1 次）', '她两次补充了你没问的细节', '她提到累，但没有拒绝聊天', '你提重映，她没接这个话头'];
  return '<div class="screen enter">' +
    '<p class="t-title">分析结果</p>' +
    '<p class="t-cap mt16">看到的信号</p>' +
    '<div class="list mt8">' + sigs.map(function (s) { return '<div class="li"><div class="grow"><p class="t-body">' + s + '</p></div></div>'; }).join('') + '</div>' +
    '<p class="t-cap mt24">关系判断</p>' +
    '<p class="t-h2 mt8">' + p.stage + '<span class="t-aux" style="font-weight:400;margin-left:8px">' + p.trText + '</span></p>' +
    '<p class="t-aux mt8">' + (warn ? '从「暧昧升温」退到「需要空间」。一个拒绝信号就够降级。' : '从「熟悉建立」进到「暧昧升温」。进阶段需要多个信号同时成立。') + '</p>' +
    '<div class="mt16"><div class="bound ' + (warn ? 'warn' : '') + '"><em></em><span>' + p.bound.text + '</span></div></div>' +
    '<div class="mt24"><button class="btn primary" data-go="reply">生成回复建议</button></div>' +
    '<div class="mt8"><button class="btn plain" data-go="panel">回到关系面板</button></div>' +
  '</div>';
}

function replyScreen() {
  const p = person();
  const warn = !p.bound.ok;
  const tone = ['温柔', '幽默', '真诚', '克制'].map(function (t, i) {
    return '<div class="' + (i === 0 ? 'on' : '') + '"><span>' + t + '</span></div>';
  }).join('');
  const cands = (REPLIES[p.id] || REPLIES.linxia).map(function (r) {

      '<div class="m">' + (r.ok ? '<span>' + r.m + '</span>' : '<b>这条先别发</b><span>' + r.m + '</span>') +
      (r.ok ? '<span class="copy" data-copy="1">复制</span>' : '') + '</div></div>';
  }).join('');
  return '<div class="screen enter">' +
    '<p class="t-title">回复建议</p>' +
    '<p class="quote mt16">' + (LASTS[p.id] || LASTS.linxia) + '</p>' +
    '<div class="seg sm mt24">' + tone + '</div>' +
    (warn ? '<div class="bound warn mt8"><em></em><span>她说了「改天吧」，这次不推进。3 条邀约模板已停用。</span></div>' : '') +
    '<div class="mt16">' + cands + '</div>' +
    '<p class="t-cap mt16">三条里有一条是故意留给你对照的。能不能发，你自己判。</p>' +
  '</div>';
}

function templatesScreen() {
  const scenes = ['全部', '初识', '暧昧', '冲突', '边界'].map(function (s, i) {
    return '<div class="' + (i === 0 ? 'on' : '') + '">' + s + '</div>';
  }).join('');
  return '<div class="screen enter">' +
    '<p class="t-title">模板库</p>' +
    '<div class="seg">' + scenes + '</div>' +
    '<input class="input mt16" placeholder="搜场景、语气或一句话">' +
    '<div class="mt16">' + TEMPLATES.map(function (t) {
      return '<div class="cand"><p class="txt">' + t.t + '</p><div class="m"><span>' + t.s + ' · ' + t.g + '</span></div></div>';
    }).join('') + '</div>' +

function newScreen() {
  return '<div class="screen enter">' +
    '<p class="t-title">新建对象</p>' +
    '<div class="field"><label>怎么称呼她</label><input class="input" placeholder="林夏"></div>' +
    '<div class="field"><label>怎么认识的</label><input class="input" placeholder="朋友介绍 / 同事 / 同城活动"></div>' +
    '<div class="field"><label>她在意的事</label><input class="input" placeholder="电影、猫、讨厌熬夜"></div>' +
    '<div class="field"><label>你自己知道的分寸</label><textarea class="area" style="height:92px" placeholder="比如：不要在她忙的时候连发消息"></textarea></div>' +
    '<div class="mt24"><button class="btn primary" data-go="home">保存</button></div>' +
    '<div class="mt8"><button class="btn plain" data-go="panel">取消</button></div>' +
  '</div>';
}

function settingsScreen() {
  const st = D.apiKey ? '已保存在本机' : '还没填。没填时只走模板库，不报错。';
  return '<div class="screen enter">' +
    '<p class="t-title">模型设置</p>' +
    '<div class="field"><label>DeepSeek API Key</label><input class="input" id="keyinput" type="password" placeholder="sk-..." value="' + D.apiKey + '"></div>' +
    '<p class="t-aux mt8" id="keystate">' + st + '</p>' +
    '<div class="mt16"><button class="btn primary" id="save-key">保存到本机</button></div>' +
    '<div class="mt8"><button class="btn plain" id="clear-key">清除</button></div>' +
    '<p class="t-aux mt24">Key 只存在这台设备里，不上传、不进日志、不进代码仓库。换设备要重新填。</p>' +
    '<p class="t-aux mt12">网页版直连会被浏览器的跨域策略拦掉。想跑通真实请求，要用 Windows 桌面版或 Android 真机。</p>' +
    '<div class="mt24"><button class="btn plain" data-go="me">返回</button></div>' +
  '</div>';
}

function meScreen() {
  const rows = [
    ['模型设置', 'settings'],
    ['导出我的数据', ''],
    ['删除聊天原文', ''],
    ['关于', '']
  ].map(function (r) {
    return '<div class="li ' + (r[1] ? 'tap' : '') + '" ' + (r[1] ? 'data-go="' + r[1] + '"' : '') + '>' +
      '<div class="grow"><p class="t-body">' + r[0] + '</p></div><span class="chev">›</span></div>';
  }).join('');
  return '<div class="screen enter">' +
    '<p class="t-title">我的</p>' +
    '<div class="list mt24">' + rows + '</div>' +
    '<div class="list"><div class="li tap"><div class="grow"><p class="t-body" style="color:var(--risk)">删除账户</p></div><span class="chev">›</span></div></div>' +
    '<p class="t-cap mt32">妙恋畅语 · 原型 v2.15<br>设计与排布 · 阿砚 · 2026-10-25</p>' +
  '</div>';
}

const SCREENS = {
  welcome: welcomeScreen, home: homeScreen, panel: panelScreen, import: importScreen, ocr: ocrScreen,
  analyzing: analyzingScreen, analysis: analysisScreen, reply: replyScreen, templates: templatesScreen,
  new: newScreen, settings: settingsScreen, me: meScreen
};

function render() {
  if (window.__timers) window.__timers.forEach(clearTimeout);
  window.__timers = [];
  document.getElementById('view').innerHTML = (SCREENS[D.screen] || homeScreen)();
  const nav = document.getElementById('nav');
  nav.className = 'nav' + (D.screen === 'welcome' || D.screen === 'analyzing' ? ' hide' : '');
  Array.prototype.forEach.call(nav.querySelectorAll('[data-tab]'), function (el) {
    el.className = el.dataset.tab === D.screen ? 'on' : '';
  });
  document.getElementById('view').scrollTop = 0;
  if (D.screen === 'welcome') {
    const cb = document.getElementById('agree');
    const btn = document.getElementById('enter');
    cb.addEventListener('change', function () { btn.disabled = !cb.checked; });
    btn.addEventListener('click', function () { go('home'); });
  }
  if (D.screen === 'analyzing') {
    [280, 620, 1420, 2020].forEach(function (ms, i) {
      window.__timers.push(setTimeout(function () {
        const el = document.getElementById('st' + i);
        if (!el) return;
        el.classList.remove('act');
        el.classList.add('done');
        el.querySelector('em').textContent = '✓';
        const nx = document.getElementById('st' + (i + 1));
        if (nx) nx.classList.add('act');
      }, ms));
    });
    window.__timers.push(setTimeout(function () { go('analysis'); }, 2500));
  }
}

function go(s) {
  if (s === 'home' || s === 'panel') D.sampleMode = 'normal';
  D.screen = s;
  render();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(window.__tt);
  window.__tt = setTimeout(function () { t.classList.remove('on'); }, 1600);
}

function openSheet(k) {
  const p = PEOPLE[D.current];
  const d = p.dims.filter(function (x) { return x.k === k; })[0];
  if (!d) return;
  document.getElementById('sheetbox').innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:baseline">' +
      '<span class="t-cap">' + d.k + '</span>' +
      '<span class="t-h2">' + d.lv + '</span>' +
    '</div>' +
    '<p class="t-aux mt8">' + d.trText + '</p>' +
    '<p class="t-body mt16">' + d.ev + '</p>' +
    '<div class="quote mt16">' + d.src + '</div>' +
    '<p class="t-cap mt12">证据取自截图原图，不是识别出来的文字。</p>';
  document.getElementById('sheet').classList.add('on');
}

document.addEventListener('click', function (ev) {
  const sheet = document.getElementById('sheet');
  if (ev.target === sheet) { sheet.classList.remove('on'); return; }
  const dim = ev.target.closest('[data-dim]');
  if (dim) { openSheet(dim.dataset.dim); return; }
  const tab2 = ev.target.closest('[data-tab2]');
  if (tab2) { D.importTab = tab2.dataset.tab2; render(); return; }
  const ocr = ev.target.closest('[data-ocr]');
  if (ocr) { const i = +ocr.dataset.ocr; D.ocrRows[i].me = !D.ocrRows[i].me; render(); return; }
  const per = ev.target.closest('[data-person]');
  if (per) { D.current = per.dataset.person; D.sampleMode = 'normal'; go('panel'); return; }
  const copy = ev.target.closest('[data-copy]');
  if (copy) { toast('已复制，发不发你自己定'); return; }
  const fold = ev.target.closest('[data-fold]');
  if (fold) { toast('原型里暂不展开'); return; }
  const nav = ev.target.closest('[data-go]');
  if (nav) { go(nav.dataset.go); return; }
  if (ev.target.id === 'do-ocr') { go('ocr'); return; }
  if (ev.target.id === 'do-analyze') { go('analyzing'); return; }
  if (ev.target.id === 'fill-normal') { D.sampleMode = 'normal'; render(); return; }
  if (ev.target.id === 'fill-boundary') { D.sampleMode = 'boundary'; render(); return; }
  if (ev.target.id === 'save-key') {
    const v = document.getElementById('keyinput').value.trim();
    D.apiKey = v;
    if (v) lsSet('mly_api_key', v); else lsDel('mly_api_key');
    document.getElementById('keystate').textContent = v ? '已保存在本机' : '还没填。没填时只走模板库，不报错。';
    toast(v ? '已保存' : '已清空');
    return;
  }
  if (ev.target.id === 'clear-key') {
    D.apiKey = '';
    lsDel('mly_api_key');
    document.getElementById('keyinput').value = '';
    document.getElementById('keystate').textContent = '还没填。没填时只走模板库，不报错。';
    toast('已清除');
    return;
  }
});

render();
</script>
